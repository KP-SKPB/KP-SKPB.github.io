<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- shorcout icon -->
    <link
      rel="shortcut icon"
      href="https://www.its.ac.id/pendidikan/wp-content/themes/UnitITS/assets/img/favicon.png"
    />

    <!-- custom css file -->
    <link rel="stylesheet" href="../../style/learn.css" />

    <title>Kalkulus 1</title>

    <!-- font awesome for logo FB, IG, etc-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- custom js file -->
    <!-- <script type="text/javascript" src="../../Js/learn.js" defer></script> -->

    <!-- katex for equation -->
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        renderMathInElement(document.body, {
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true },
            {
              left: "\\begin{equation*}",
              right: "\\end{equation*}",
              display: true,
            },
            {
              left: "\\begin{equation}",
              right: "\\end{equation}",
              display: true,
            },
            { left: "\\begin{align}", right: "\\end{align}", display: true },
            { left: "\\begin{align*}", right: "\\end{align*}", display: true },
          ],
          // • rendering keys, e.g.:
          throwOnError: false,
        });
      });
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css"
      integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"
      integrity="sha384-Rma6DA2IPUwhNxmrB/7S3Tno0YY7sFu9WSYMCuulLhIqYSGZ2gKCJWIqhBWqMQfh"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"
      integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh"
      crossorigin="anonymous"
      onload="renderMathInElement(document.body);"
    ></script>

    <!-- math input -->
    <script src="https://unpkg.com/mathlive"></script>

    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.3/purify.min.js"
    ></script>
  </head>
  <body>
    <nav class="sidebar hidden-nav" id="sidebar"></nav>
    <header id="header"></header>
    <script type="text/javascript" src="../../Js/import2.js" async></script>

    <div class="progress-container">
      <div class="progress-bar" id="myBar"></div>
    </div>

    <main class="content" id="main-content">
      <h2 class="judul-bab-container">
        <section class="no-subbab">1.1</section>
        <span class="judul-bab">Fungsi Transenden</span>
      </h2>
      <div class="dfn-box definisi">
        <div class="dfn-header">Definisi 1.1</div>
        <div class="dfn-content">
          Jika n bilangan positif, maka $$a^n=\underbrace{a.a.a\ldots
          a}_{n\text{ faktor}}$$
        </div>
      </div>
    </main>
    <script type="module">
      import "//unpkg.com/mathlive?module";
      import "//unpkg.com/@cortex-js/compute-engine";

      const ce = MathfieldElement.computeEngine;

      const answerButton = document.getElementById("submitAnswer");
      const answerElements = document.querySelectorAll(".answer");
      const bgColorAnswer = answerElements[0].style.backgroundColor;
      const borderColorAnswer = answerElements[0].style.borderColor;

      const correctAnswers = [
        ce.parse("\\left\\lbrace x\\le\\frac94\\right\\rbrace"),
        ce.parse("\\left\\lbrace x>\\frac13\\right\\rbrace"),
      ];

      answerButton.addEventListener("click", () => {
        answerElements.forEach((answerElement) => {
          answerElement.style.backgroundColor = bgColorAnswer;
          answerElement.style.borderColor = borderColorAnswer;
        });
        answerElements.forEach((answerElement, index) => {
          let studentInput = answerElement.expression;
          const expectedAnswer = correctAnswers[index];

          if (
            index == 0 &&
            (answerElement.value ===
              "\\left(-\\infty,\\frac94\\right\\rbrack" ||
              answerElement.value === "(-\\infty,\\frac94\\rbrack" ||
              answerElement.value === "\\left(-\\infty,\\9/4\\right\\rbrack" ||
              answerElement.value === "(-\\infty,\\9/4\\rbrack")
          ) {
            studentInput = expectedAnswer;
          }

          if (
            studentInput.isSame(ce.parse("\\left(\\frac13,+\\infty\\right)"))
          ) {
            studentInput = expectedAnswer;
          }

          const loading = document.getElementById("loading");
          const feedback = document.querySelectorAll(".jawaban-latihan");

          loading.classList.remove("hidden");

          setTimeout(() => {
            loading.classList.add("hidden");
            feedback.forEach((el) => {
              el.classList.remove("hidden");
            });
            if (!studentInput.isSame(expectedAnswer)) {
              answerElement.style.backgroundColor = "rgba(255, 192, 203, 0.5)";
              answerElement.style.borderColor = "red";
            } else {
              answerElement.style.backgroundColor = "rgba(172, 255, 47, 0.5)";
              answerElement.style.borderColor = "green";
            }
          }, 2000);
        });
      });
    </script>
  </body>
</html>
